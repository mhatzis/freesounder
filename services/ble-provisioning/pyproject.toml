[project]
name = "freesounder-ble-provisioning"
version = "0.3.6"
description = "Improv Wi-Fi BLE provisioning for a FreeSounder player."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
authors = [{ name = "freesounder contributors" }]
dependencies = [
  "dbus-next>=0.2.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
freesounder-ble-provisioning = "freesounder_ble_provisioning.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]


[tool.ruff.lint.per-file-ignores]
# dbus-next reads D-Bus signature strings from annotations.
"src/freesounder_ble_provisioning/bluez.py" = ["F722", "F821", "UP037", "E501"]

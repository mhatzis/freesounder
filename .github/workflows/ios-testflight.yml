name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      # App releases only (v0.4.0). Image tags like v0.4.0-alpha-image are excluded.
      - "v[0-9]+.[0-9]+.[0-9]+"

# Reuse the iOS Distribution certificate stored in repo secrets.
# Do not mint a new distribution certificate on each run — Apple limits them.
# Secrets: ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID,
#          IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE

jobs:
  testflight:
    name: Build and upload
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Install signing certificate and profile
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$IOS_DIST_CERT_P12" | base64 --decode > "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "Installed profile $PROFILE_UUID"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-name=0.4.0 \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: freesounder-ipa
          path: apps/flutter/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa)
          echo "Uploading $IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          python3 - <<'PY'
          import os, re, textwrap
          from pathlib import Path
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----[^-]+-----|\s", "", raw)
          pem = (
              "-----BEGIN PRIVATE KEY-----\n"
              + "\n".join(textwrap.wrap(body, 64))
              + "\n-----END PRIVATE KEY-----\n"
          )
          key_id = os.environ["ASC_KEY_ID"]
          dest = Path.home() / ".appstoreconnect" / "private_keys" / f"AuthKey_{key_id}.p8"
          dest.write_text(pem)
          dest.chmod(0o600)
          PY
          xcrun altool --upload-app --type ios \
            -f "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --output-format xml

      - name: Add build to Internal beta group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_BETA_GROUP_ID: f9da97e0-7e7a-4483-8744-5715c49260f0
          BUNDLE_ID: com.mhatzis.freesounder
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install PyJWT cryptography requests
          "$RUNNER_TEMP/asc-venv/bin/python" << 'PY'
          import json, os, time, pathlib, textwrap, re
          import jwt
          import requests

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----[^-]+-----|\s", "", raw)
          pem = (
              "-----BEGIN PRIVATE KEY-----\n"
              + "\n".join(textwrap.wrap(body, 64))
              + "\n-----END PRIVATE KEY-----\n"
          )
          def headers():
              now = int(time.time())
              token = jwt.encode(
                  {"iss": issuer, "iat": now, "exp": now + 18 * 60, "aud": "appstoreconnect-v1"},
                  pem,
                  algorithm="ES256",
                  headers={"kid": key_id},
              )
              return {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          base = "https://api.appstoreconnect.apple.com/v1"
          apps = requests.get(
              f"{base}/apps",
              headers=headers(),
              params={"filter[bundleId]": os.environ["BUNDLE_ID"]},
              timeout=60,
          )
          apps.raise_for_status()
          app_id = apps.json()["data"][0]["id"]
          build_id = None
          processing = None
          for _ in range(40):
              res = requests.get(
                  f"{base}/builds",
                  headers=headers(),
                  params={
                      "filter[app]": app_id,
                      "filter[version]": os.environ["BUILD_NUMBER"],
                      "sort": "-uploadedDate",
                      "limit": 5,
                  },
                  timeout=60,
              )
              res.raise_for_status()
              items = res.json().get("data") or []
              if items:
                  processing = items[0]["attributes"].get("processingState")
                  print(f"build {items[0]['id']} processingState={processing}")
                  if processing == "VALID":
                      build_id = items[0]["id"]
                      break
                  if processing in {"INVALID", "FAILED"}:
                      raise SystemExit(f"TestFlight build {processing}")
              else:
                  print("waiting for the uploaded build to appear")
              time.sleep(30)
          if not build_id:
              raise SystemExit(f"Build did not become VALID in time (last state={processing})")
          group = os.environ["ASC_BETA_GROUP_ID"]
          add = requests.post(
              f"{base}/betaGroups/{group}/relationships/builds",
              headers=headers(),
              json={"data": [{"type": "builds", "id": build_id}]},
              timeout=60,
          )
          if add.status_code not in {200, 201, 204, 409}:
              raise SystemExit(f"Could not add build to group: {add.status_code} {add.text}")
          print(f"Added build {build_id} to Internal group {group} (HTTP {add.status_code})")
          PY

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-api:
    name: control-api (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest

  player-agent:
    name: player-agent (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/player-agent
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest

  flutter:
    name: flutter (analyze + test + web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release

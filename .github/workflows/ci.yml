name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

jobs:
  freesounderd:
    name: freesounderd (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/freesounderd
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: ALSA + fsdsp build deps (real live-DSP chain test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends alsa-utils libasound2-plugins libasound2-dev gcc
          # Real-time loopback device for the no-underrun test, if this kernel has it.
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" || true
          sudo modprobe snd-aloop && sudo chmod a+rw /dev/snd/* || echo "snd-aloop unavailable"
      - name: Build fsdsp
        working-directory: services/fsdsp
        run: make CFLAGS="-O2 -Wall -Wextra -Werror"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest -rs

  ble-provisioning:
    name: ble-provisioning (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ble-provisioning
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest

  flutter:
    name: flutter (analyze + test + web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release

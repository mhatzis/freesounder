# FreeSounder audio FIFOs read by snapserver on a group leader.
d /run/freesounder 0755 root root -
p /run/freesounder/spotify.fifo 0666 root root -
p /run/freesounder/radio.fifo 0666 root root -
p /run/freesounder/idle.fifo 0666 root root -
# MPD (library, podcasts, UPnP/DLNA) writes here.
p /run/freesounder/mpd.fifo 0666 root root -
d /var/lib/freesounder/spotify 0700 root root -
d /var/lib/freesounder/music 0755 root root -
d /var/lib/freesounder/mpd 0755 mpd audio -

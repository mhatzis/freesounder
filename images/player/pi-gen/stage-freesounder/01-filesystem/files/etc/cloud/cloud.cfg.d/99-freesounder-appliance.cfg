# Appliance policy. Bootfs user-data is also sanitised before cloud-init runs.
users: []
disable_root: true
ssh_pwauth: false
preserve_hostname: true
ssh_deletekeys: false
ssh_genkeytypes: []
# A/B layout: root is a fixed-size slot. Never grow or resize it (the data partition grows instead).
growpart:
  mode: "off"
resize_rootfs: false

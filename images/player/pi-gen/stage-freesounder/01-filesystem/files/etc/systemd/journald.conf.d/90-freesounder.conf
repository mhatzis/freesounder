# FreeSounder: keep the journal across reboots so a crash can be explained.
# Named 90- so it sorts after Raspberry Pi OS's 40-rpi-volatile-storage.conf
# (Storage=volatile), which 00-run.sh also masks with a /dev/null symlink.
[Journal]
Storage=persistent
SystemMaxUse=50M
SystemKeepFree=200M
SystemMaxFileSize=8M
MaxRetentionSec=1month
# Write to the SD card every 15 s, so a hard power loss loses at most ~15 s.
# (Messages at crit/alert/emerg are always synced immediately.)
SyncIntervalSec=15s

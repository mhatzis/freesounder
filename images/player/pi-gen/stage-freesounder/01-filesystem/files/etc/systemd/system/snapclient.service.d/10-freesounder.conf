# FreeSounder: pick the output (DAC/HAT, USB, connected HDMI, or null sink)
# and render the `freesounder` ALSA chain before snapclient opens it. The
# server URL and a stable host ID come from freesounderd, which restarts
# snapclient when the room moves to another group (snapcast#527: a client
# cannot switch servers without a restart).
[Unit]
After=sound.target freesounderd.service
StartLimitIntervalSec=0

[Service]
EnvironmentFile=-/run/freesounder/snapclient.env
ExecStartPre=+-/usr/lib/freesounder/select-audio-output
ExecStart=
ExecStart=/usr/bin/snapclient --logsink=system --hostID ${FS_PLAYER_ID} $SNAPCLIENT_OPTS $SNAPCLIENT_URL
Restart=always
RestartSec=1

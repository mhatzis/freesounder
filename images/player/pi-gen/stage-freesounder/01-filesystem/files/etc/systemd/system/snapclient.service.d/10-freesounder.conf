# FreeSounder: pick the output (DAC/USB, connected HDMI, or null sink) and
# render the `freesounder` ALSA chain before snapclient opens it, and never
# give up restarting, so the room always registers with Music Assistant.
[Unit]
After=freesounder-role.service sound.target
StartLimitIntervalSec=0

[Service]
ExecStartPre=+-/usr/lib/freesounder/select-audio-output
Restart=always
RestartSec=5

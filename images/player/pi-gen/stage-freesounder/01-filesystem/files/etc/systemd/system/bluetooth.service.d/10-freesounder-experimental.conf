[Service]
# ScanResponseManufacturerData / ScanResponseData are experimental D-Bus
# properties in BlueZ 5.82; they are required so manufacturer data and the
# short 'FS' name go in the scan response and do not overflow the 31-byte
# primary Improv PDU.
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --experimental

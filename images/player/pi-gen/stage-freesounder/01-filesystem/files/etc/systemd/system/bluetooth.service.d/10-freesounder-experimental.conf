[Service]
# ScanResponseManufacturerData is an experimental advertising property in
# BlueZ 5.82. It puts manufacturer data in the scan response so the 31-byte
# primary Improv PDU stays intact. The short name FS-XXXX goes in the scan
# response through the standard LocalName property. (Name types are refused
# inside ScanResponseData by BlueZ's AD type reject list.)
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --experimental

# EXPERIMENTAL (exp/bt-transmitter): Bluetooth speaker output.
# A2DP *source* only: this player sends audio to a speaker. No A2DP sink
# (nothing can play to the player over Bluetooth), no HFP/HSP (no SCO links)
# and no LE audio, so the Improv BLE setup service keeps the LE side to itself.
# Not started at boot: freesounderd starts it once a speaker is set up in the
# app. --keep-alive keeps the link up for a few seconds while snapclient
# re-opens the PCM (output changes, restarts).
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-source --keep-alive=5 --io-rt-priority=40
# Real-time IO threads so the SBC encoder is not starved by snapclient, the
# DSP or Wi-Fi interrupts (bluez-alsa's own unit documents these relaxations).
AmbientCapabilities=CAP_NET_RAW CAP_SYS_NICE
CapabilityBoundingSet=CAP_NET_RAW CAP_SYS_NICE
RestrictRealtime=false
SystemCallFilter=@resources

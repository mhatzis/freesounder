// FreeSounder: shairport-sync is started by snapserver (AirPlay stream).
// The room / group volume (snapclient) is the only attenuation, so the
// AirPlay audio stays at full level and the sender's volume slider is
// reported to freesounderd, which turns it into the group volume.
general =
{
	ignore_volume_control = "yes";
	volume_range_db = 30;
	// The AirPlay volume (0.0 .. -30.0, -144.0 = mute) is appended.
	run_this_when_volume_is_set = "/usr/lib/freesounder/airplay-volume ";
};

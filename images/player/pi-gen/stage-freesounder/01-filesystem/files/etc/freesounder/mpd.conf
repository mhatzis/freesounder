# MPD for FreeSounder: music library, podcasts, and the UPnP/DLNA renderer
# (upmpdcli). Local only; freesounderd drives it. Audio goes to the group
# leader's snapserver ("Media" stream) and from there through the room's
# ALSA chain (fsdsp: bass, treble, loudness, balance).
music_directory     "/var/lib/freesounder/music"
db_file             "/var/lib/freesounder/mpd/database"
bind_to_address     "127.0.0.1"
port                "6600"
zeroconf_enabled    "no"
auto_update         "no"
follow_outside_symlinks "no"
filesystem_charset  "UTF-8"
replaygain          "off"
# Small buffers for the Pi Zero 2 W (512 MB).
max_output_buffer_size "4096"
connection_timeout  "120"
max_connections     "12"

input {
	plugin "curl"
}

audio_output {
	type        "fifo"
	name        "FreeSounder"
	path        "/run/freesounder/mpd.fifo"
	format      "44100:16:2"
	# The group volume (snapclient) is the only attenuation; MPD only reports
	# a UPnP controller's volume slider to freesounderd.
	mixer_type  "null"
}

resampler {
	plugin  "soxr"
	quality "medium"
}

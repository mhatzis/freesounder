# RAUC on a FreeSounder player: A/B slots switched with the Raspberry Pi tryboot / autoboot.txt
# mechanism (custom bootloader backend). Partition layout: see /usr/lib/freesounder/ota/fsota.py.
# The disk id is fixed (0x46534f54), so these PARTUUIDs are the same on every player.
[system]
compatible=freesounder-player-arm64
bootloader=custom
mountprefix=/run/rauc
statusfile=/data/ota/rauc.status
# Only dm-verity bundles: every block is checked as it is read, also when streaming.
bundle-formats=-plain
max-bundle-download-size=2147483648

[keyring]
# FreeSounder OTA CA certificate (public). Bundles are signed by a cert issued by this CA.
path=/etc/rauc/keyring.pem
check-purpose=codesign
# Players have no RTC: verify the signer against the bundle's signing time, not the (maybe unset) clock.
use-bundle-signing-time=true

[streaming]
sandbox-user=nobody

[handlers]
bootloader-custom-backend=/usr/lib/freesounder/ota/rauc-backend
post-install=/usr/lib/freesounder/ota/post-install

[slot.rootfs.0]
device=/dev/disk/by-partuuid/46534f54-05
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/46534f54-06
type=ext4
bootname=B

[slot.boot.0]
device=/dev/disk/by-partuuid/46534f54-02
type=vfat
parent=rootfs.0

[slot.boot.1]
device=/dev/disk/by-partuuid/46534f54-03
type=vfat
parent=rootfs.1
